services:
  flaghunter:
    image: ghcr.io/gh05tcrew/flaghunter:latest
    container_name: flaghunter_with_n8n_mcp
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - FLAGHUNTER_MODEL=${FLAGHUNTER_MODEL}
      - FLAGHUNTER_DEBUG=${FLAGHUNTER_DEBUG:-false}
    volumes:
      - ./mcp_servers.json:/app/mcp_servers.json
    networks:
      - flaghunter-net
    stdin_open: true
    tty: true


networks:
  flaghunter-net:
    driver: bridge
